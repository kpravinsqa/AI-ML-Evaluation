[pytest]
testpaths = tests
pythonpath = .
addopts = -v --strict-markers --html=reports/report.html --self-contained-html
markers =
    data: data validation & leakage checks
    performance: model quality gates
    fairness: bias / fairness checks across protected groups
    robustness: invariance, directional and perturbation tests
    calibration: probability calibration
    drift: production monitoring (data & prediction drift)
    contract: inference API contract, latency, reproducibility
    explainability: feature importance and reason codes
    smoke: fast critical checks
